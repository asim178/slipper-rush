# Builds the Android APK on GitHub's computers every time you push,
# or when you press "Run workflow" on the Actions tab.
# The APK appears under the run's "Artifacts" (slipper-rush-apk).
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04 # comes with the Android SDK already installed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: slipper-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
